name: ucla-seat-watch

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min, GitHub's minimum (runs can be a few minutes late under load)
  workflow_dispatch:          # the app's "Send test alert" button, or the Run workflow button
    inputs:
      mode:
        description: "check = normal run, test = send a test alert"
        default: check
        type: choice
        options: [check, test]

permissions:
  contents: write             # to commit state.json (dedupes alerts between runs)

concurrency:
  group: ucla-seat-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Check seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          SMS_TO:     ${{ secrets.SMS_TO }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python3 watch.py --test-notify
          else
            python3 watch.py
          fi

      - name: Persist state
        if: always() && github.event.inputs.mode != 'test'
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "seat-watch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state update [skip ci]"
            git pull --rebase --quiet || true
            git push --quiet
          fi
